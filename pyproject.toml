[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "pyprimer"
version = "0.1.0"
description = "A bioinformatic pipeline for identifying intron length variation across species to design diagnostic multiplex PCR primers."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Ryan Ridenbaugh", email = "ridenbaughryan@gmail.com" }
]
keywords = ["bioinformatics", "PCR", "primers", "intron", "genomics", "phylogenetics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.8"
dependencies = []

[project.urls]
Homepage = "https://github.com/RDRidenbaugh/PyPrimer"
Repository = "https://github.com/RDRidenbaugh/PyPrimer"
"Bug Tracker" = "https://github.com/RDRidenbaugh/PyPrimer/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["pyprimer*"]